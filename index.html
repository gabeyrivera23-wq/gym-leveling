<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GYM Leveling</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#030a1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--panel:#eef3ff;--ink:#0b1430;--mute:#55638a;--blue:#1f5bff;--line:#bccdff;--glow:rgba(31,91,255,.15);--onblue:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050914;--panel:#0a1530;--ink:#eaf1ff;--mute:#8fa3d6;--blue:#3d8bff;--line:#1c3a78;--glow:rgba(61,139,255,.35);--onblue:#031030}}
:root[data-theme="dark"]{--bg:#050914;--panel:#0a1530;--ink:#eaf1ff;--mute:#8fa3d6;--blue:#3d8bff;--line:#1c3a78;--glow:rgba(61,139,255,.35);--onblue:#031030}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rajdhani',system-ui,sans-serif;font-weight:500;font-size:18px;line-height:1.35}
main{max-width:520px;margin:0 auto;padding:14px 14px 140px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ttl{flex:1;min-width:0}header h1{font-size:26px;font-weight:700;margin:0;letter-spacing:.5px;line-height:1.1}#un{display:block;font-size:15px;color:var(--mute)}
.logo{width:72px;height:72px;color:var(--blue);filter:drop-shadow(0 0 6px var(--glow))}
.win{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.win h2{font-size:18px;font-weight:700;margin:0 0 8px;color:var(--blue)}
.lvl{display:flex;align-items:baseline;gap:10px}
.lvl b{font-size:44px;line-height:1;color:var(--blue);text-shadow:0 0 12px var(--glow)}
.bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue);box-shadow:0 0 8px var(--blue)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
nav button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;padding:4px 8px;border:0;border-radius:16px;background:transparent;color:var(--mute);font-size:14px}
nav button svg{width:26px;height:26px}
nav button.on{background:var(--line);color:var(--blue)}
.ni{flex:1;position:relative;display:flex;justify-content:center;max-width:140px}
.ni>button:not(.fab){width:100%}
nav .fab{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 10px);z-index:4;display:block;flex:none;width:auto;max-width:none;white-space:nowrap;min-height:40px;padding:4px 20px;border:0;border-radius:999px;background:var(--blue);color:var(--onblue);font-size:16px;box-shadow:0 4px 12px var(--glow)}
nav .fab.first{left:0;transform:none}
.win.hl{border:1.5px solid var(--blue);box-shadow:0 0 18px var(--glow),inset 0 0 14px var(--glow)}
.coach h2{display:flex;align-items:center;gap:8px}
.coach p{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.ex{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .ic{flex:none;width:52px;height:52px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--blue)}
.ex .gi{flex:1;min-width:0}
.ex small{display:block;color:var(--mute);font-size:15px}
.seg{display:flex;gap:3px;margin-top:6px}
.seg i{width:18px;height:8px;border-radius:2px;background:var(--line)}
.seg i.f{background:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-height:36px;padding:2px 12px;font-size:15px;border:1px solid var(--line);border-radius:999px;color:var(--ink)}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;border:1.5px solid var(--blue);background:transparent;color:var(--blue);padding:8px 14px;min-height:44px}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.on,button.go{background:var(--blue);color:var(--onblue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select{font:inherit;width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
label{font-size:15px;color:var(--mute);display:block}
.tot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.tot b{display:block;font-size:26px;color:var(--blue)}
.tot span{font-size:14px;color:var(--mute)}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ring{text-align:center}.ring>div{font-weight:700}.ring svg{width:100%;max-width:130px;display:block;margin:0 auto}.ring text{fill:var(--ink);text-anchor:middle}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
li small{color:var(--mute);display:block;font-size:15px}
li button{min-height:36px;padding:2px 10px;font-size:15px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row button{flex:1}
.empty{color:var(--mute);margin:4px 0}
#msg{position:fixed;left:16px;right:16px;bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:6;text-align:center;pointer-events:none;color:var(--blue);font-weight:700;text-shadow:0 0 8px var(--bg),0 0 8px var(--bg)}
.dial{position:relative;width:210px;max-width:70%;margin:8px auto}
.dial svg{width:100%;display:block}
.dial b{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;color:var(--ink)}
.chip.sel{background:var(--blue);color:var(--onblue);border-color:var(--blue)}
.foot{display:flex;align-items:center;gap:12px;margin-top:8px}
.foot button{flex:none}
.note{margin:0;color:var(--mute);font-size:15px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}
.mini b{font-size:22px;color:var(--blue)}
.mini small{display:block;color:var(--mute);font-size:14px}
.grp{font-size:16px;font-weight:600;margin:12px 0 2px;color:var(--mute)}
.q{display:flex;gap:10px;align-items:flex-start}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
textarea{font:inherit;font-size:14px;width:100%;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ans{white-space:pre-wrap;margin:8px 0}
</style></head>
<body><main>
<header>
<svg class="logo" viewBox="0 0 64 64" fill="currentColor" aria-label="Logo: perfil de un dios con piel de león"><defs><linearGradient id="sk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="currentColor"/><stop offset="1" stop-color="currentColor" stop-opacity=".4"/></linearGradient><linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor"/><stop offset="1" stop-color="currentColor" stop-opacity=".5"/></linearGradient><clipPath id="lc"><circle cx="32" cy="32" r="30.5"/></clipPath></defs><circle cx="32" cy="32" r="31" fill="#030a1c"/><g clip-path="url(#lc)"><path d="M30 6c12-2 24 4 26 18 1 10-4 18-10 22l-6-18z" fill="currentColor" opacity=".35"/><path d="M40 8q8 2 10 9M44 12q8 3 8 11M46 20q6 4 4 12M42 30q6 2 4 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".8"/><path d="M24 20C20 22 19 27 20 30L16 38c-1 2 1 3 3 3l1 3c2 2 4 3 6 2l14-6 4-16C42 18 30 16 24 20z" fill="url(#sk)"/><path d="M30 34c3 4 2 9-2 12l12-6 3-10c-4 1-9 2-13 4z" fill="#030a1c" opacity=".3"/><path d="M19 29q6-3 11 0v4q-6-2-11-1z" fill="#030a1c" opacity=".55"/><path d="M18 29l12 1" stroke="#030a1c" stroke-width="2.6" stroke-linecap="round"/><path d="M21 33q2-1.6 5 0q-2 1.8-5 0z" fill="#eaf1ff"/><circle cx="23.6" cy="33" r="1.1" fill="#030a1c"/><path d="M20 31l-3 7q-1 2 1 3" fill="none" stroke="#030a1c" stroke-width=".9" opacity=".7"/><path d="M21 44q4 1 8-1" fill="none" stroke="#030a1c" stroke-width="1.4" stroke-linecap="round"/><path d="M19 42c-5 6-3 16 7 19 10 2 20-5 22-17 1-6-2-10-4-12l-4 8c-8 4-14 6-21 2z" fill="url(#bd)"/><path d="M21 50q3-4 6-1q-1 4-5 3M26 56q4-4 7 0q-2 4-6 2M33 50q4-3 6 1q-2 3-5 2M39 56q3-4 6-1M30 45q3-2 5 1M44 47q3-2 4 2" fill="none" stroke="#030a1c" stroke-width="1.2" stroke-linecap="round" opacity=".75"/><path d="M23 47q3-3 5-1M29 53q3-3 6-1M36 47q3-2 5 0M42 53q2-3 4-2" fill="none" stroke="#eaf1ff" stroke-width=".9" stroke-linecap="round" opacity=".55"/><path d="M12 18C14 10 24 6 34 8c10 0 16 6 16 16l-4 4c-2-8-10-12-20-10l-4 4c-4 0-8 0-10-4z" fill="url(#bd)"/><path d="M20 14q3-2 7 0M24 19c-3 1-5 3-6 5M28 11q4-1 8 1M36 14q5 0 8 4" fill="none" stroke="#030a1c" stroke-width="1.3" stroke-linecap="round" opacity=".7"/><path d="M16 21l2 6 2-5z" fill="#eaf1ff"/><circle cx="13" cy="18" r="1.4" fill="#030a1c"/><ellipse cx="23" cy="15.5" rx="2" ry="1" fill="#eaf1ff" opacity=".85"/></g><circle cx="32" cy="32" r="31" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
<div class="ttl"><h1>GYM Leveling</h1><small id="un"></small></div>
<button id="th" aria-label="Cambiar entre modo claro y oscuro">Modo</button>
</header>
<div id="app"></div>
<p id="msg" role="status"></p>
<div class="foot"><button id="lg" onclick="toggleLang()">English</button><p class="note">No se acepta estar Fanton en las comidas ni en los dias de piernas</p></div>
</main>
<script>
var S={xp:0,meals:{},sets:{},theme:'',goals:{k:2200,p:150,c:220,g:70,f:28,s:2300,w:64},lang:'es',water:{},weights:{},fav:[],routines:[],plan:[],done:{},body:{},photos:[],sx:'',me:{n:'',l:'',f:'',i:'',a:'',x:'',o:'m'}},tab='comidas';
function load(){try{var r=localStorage.getItem('gl');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem('gl',JSON.stringify(S))}catch(e){}}
function day(){return new Date().toLocaleDateString('en-CA')}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v}
function say(t){var m=document.getElementById('msg');m.textContent=tr(t);clearTimeout(window._mt);if(t)window._mt=setTimeout(function(){m.textContent=''},4000)}
function theme(){var t=S.theme;if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
document.getElementById('th').onclick=function(){var dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;S.theme=dark?'light':'dark';save();theme()};
function level(){var l=1,x=S.xp;while(x>=l*100){x-=l*100;l++}return{l:l,x:x,n:l*100}}
function add(xp){var a=level().l;S.xp+=xp;save();var b=level().l;say(b>a?'¡Subiste al nivel '+b+'!':'+'+xp+' XP')}
function totals(){return totalsOf(day())}

function delMeal(i){S.meals[day()].splice(i,1);save();render()}
function addSet(){var n=document.getElementById('en').value.trim();if(!n){say('Escribe el nombre del ejercicio.');return}
(S.sets[day()]=S.sets[day()]||[]).push({n:n,w:num('ew'),r:num('er')});add(15);checkMissions();render()}
function delSet(i){S.sets[day()].splice(i,1);save();render()}
function last(n){var ds=Object.keys(S.sets).filter(function(d){return d<day()}).sort().reverse();
for(var i=0;i<ds.length;i++){var s=S.sets[ds[i]].filter(function(x){return x.n.toLowerCase()===n.toLowerCase()});
if(s.length){var b=s.reduce(function(a,x){return x.w>a.w?x:a});return b.w+' kg × '+b.r}}return ''}
function summary(){var t=totals(),L=level(),o='GYM Leveling · '+day()+'\nNivel '+L.l+'\n\nComidas:\n';
(S.meals[day()]||[]).forEach(function(f){o+='- '+f.n+': '+f.k+' kcal, P '+f.p+' g, C '+f.c+' g, G '+f.g+' g\n'});
o+='Total: '+t.k+' kcal, P '+t.p+' g, C '+t.c+' g, G '+t.g+' g\n\nEntrenamiento:\n';
(S.sets[day()]||[]).forEach(function(s){o+='- '+s.n+': '+s.w+' kg × '+s.r+'\n'});return tr(o)}
function share(){var t=summary();
if(navigator.share){navigator.share({text:t}).catch(function(){})}
else if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){say('Resumen copiado.')},function(){say('No se pudo copiar.')})}
else say('Tu navegador no permite copiar.')}
function speak(){var t=totals();if(!window.speechSynthesis){say('Tu navegador no tiene voz.');return}
var en=S.lang==='en',u=new SpeechSynthesisUtterance(en?'Today you have '+t.k+' calories, '+t.p+' grams of protein, '+t.c+' of carbs and '+t.g+' of fat.':'Hoy llevas '+t.k+' calorías, '+t.p+' gramos de proteína, '+t.c+' de carbohidratos y '+t.g+' de grasa.');u.lang=en?'en-US':'es-ES';speechSynthesis.cancel();speechSynthesis.speak(u)}
function ring(l,v,g,c){v=Math.round(v);g=g||1;var C=263.9,p=Math.min(v/g,1)*C;return'<div class="ring"><div>'+l+'</div><svg viewBox="0 0 100 100" role="img" aria-label="'+l+': '+v+' de '+g+'"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="50" cy="50" r="42" fill="none" stroke="'+c+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+p+' '+C+'" transform="rotate(-90 50 50)"/><text x="50" y="55" font-size="26" font-weight="700">'+v+'</text><text x="50" y="72" font-size="13" style="fill:var(--mute)">de '+g+'</text></svg></div>'}
function setGoal(k,v){var n=parseFloat(v);if(n>0){S.goals[k]=n;save();render()}}
var D=[['Progreso','Progress'],['Descanso entre series. Elige el tiempo y toca Iniciar.','Rest between sets. Pick a time and tap Start.'],['Escribe entre 5 y 3600 segundos.','Enter between 5 and 3600 seconds.'],['¡Descanso terminado!','Rest is over!'],['Tiempo de descanso','Rest time'],['Otro tiempo (segundos)','Other time (seconds)'],['Reiniciar','Reset'],['Iniciar','Start'],['Pausa','Pause'],['Seguir','Resume'],['Fijar','Set'],['Toca el botón azul para registrar la primera serie.','Tap the blue button to log your first set.'],['Datos guardados. Metas del día calculadas.','Data saved. Daily goals calculated.'],['Datos guardados. Completa peso, estatura, edad y sexo para calcular tus metas.','Data saved. Fill in weight, height, age and sex to calculate your goals.'],['Las metas se calculan al guardar, con la fórmula Mifflin-St Jeor y actividad moderada. Son estimaciones, no un plan médico.','Goals are calculated when you save, using the Mifflin-St Jeor formula and moderate activity. They are estimates, not medical advice.'],['Edad','Age'],['Sexo','Sex'],['Hombre','Male'],['Mujer','Female'],['Elige','Select'],['Objetivo','Goal'],['Bajar peso','Lose weight'],['Mantener','Maintain'],['Subir masa','Build muscle'],['Datos del usuario','User data'],['Datos guardados.','Data saved.'],['Guardar datos','Save data'],['Peso corporal (lb)','Body weight (lb)'],['Estatura (pies)','Height (feet)'],['Pulgadas','Inches'],['IMC','BMI'],['Nombre','Name'],['Aún no registras comidas hoy. Añade la primera arriba.','No meals logged today. Add the first one above.'],['Aún no registras series hoy. Añade la primera arriba.','No sets logged today. Add the first one above.'],['Primera vez que lo registras','First time logging this'],['Cambiar entre modo claro y oscuro','Switch between light and dark mode'],['Escribe el nombre de la comida.','Enter the food name.'],['Escribe el nombre del ejercicio.','Enter the exercise name.'],['Tu navegador no permite copiar.','Your browser cannot copy.'],['Tu navegador no tiene voz.','Your browser has no voice.'],['Logo: perfil de un dios con piel de león','Logo: profile of a god wearing a lion pelt'],['¡Subiste al nivel ','You reached level '],['Comidas registradas','Logged meals'],['Series de hoy','Today’s sets'],['Macros de hoy','Today’s macros'],['Metas del día','Daily goals'],['Añadir comida','Add food'],['Guardar comida','Save food'],['Añadir serie','Add set'],['Guardar serie','Save set'],['Compartir día','Share day'],['Leer macros','Read macros'],['Resumen copiado.','Summary copied.'],['No se pudo copiar.','Could not copy.'],['Arroz con pollo','Chicken and rice'],['Carbohidratos','Carbs'],['Repeticiones','Reps'],['Entrenamiento','Training'],['Última vez: ','Last time: '],['Calorías','Calories'],['Ejercicio','Exercise'],['Peso (kg)','Weight (kg)'],['Sentadilla','Squat'],['Proteína','Protein'],['Comidas','Meals'],['Comida','Food'],['Sistema','System'],['Rutina','Routine'],['Borrar','Delete'],['Grasa','Fat'],['Nivel','Level'],['>de ','>of '],[' de ',' of ']];
D.sort(function(a,b){return b[0].length-a[0].length});
function tr(s){if(S.lang!=='en')return s;D.forEach(function(p){s=s.split(p[0]).join(p[1])});return s}
function ui(){var en=S.lang==='en',b=document.getElementById('th');document.documentElement.lang=en?'en':'es';b.textContent=en?'Mode':'Modo';b.setAttribute('aria-label',tr('Cambiar entre modo claro y oscuro'));document.getElementById('un').textContent=S.me.n;document.getElementById('lg').textContent=en?'Español':'English'}
function toggleLang(){S.lang=S.lang==='en'?'es':'en';save();ui();say('');render()}
function me(){var m=S.me,b=m.l>0&&m.f>0?(m.l*.45359237/Math.pow((m.f*12+(+m.i||0))*.0254,2)).toFixed(1):'';return'<section class="win"><h2>Datos del usuario</h2><label for="mn">Nombre</label><input id="mn" value="'+esc(m.n)+'"><label for="mw">Peso corporal (lb)</label><input id="mw" type="number" inputmode="decimal" value="'+(m.l||'')+'"><div class="grid"><div><label for="mf">Estatura (pies)</label><input id="mf" type="number" inputmode="numeric" value="'+(m.f||'')+'"></div><div><label for="mi">Pulgadas</label><input id="mi" type="number" inputmode="decimal" value="'+(m.i||'')+'"></div></div><div class="grid"><div><label for="ma">Edad</label><input id="ma" type="number" inputmode="numeric" value="'+(m.a||'')+'"></div><div><label for="ms">Sexo</label><select id="ms">'+opt('','Elige',m.x||'')+opt('h','Hombre',m.x)+opt('m','Mujer',m.x)+'</select></div></div><label for="mo">Objetivo</label><select id="mo">'+opt('b','Bajar peso',m.o)+opt('m','Mantener',m.o||'m')+opt('s','Subir masa',m.o)+'</select><p class="empty">Las metas se calculan al guardar, con la fórmula Mifflin-St Jeor y actividad moderada. Son estimaciones, no un plan médico.</p>'+(b?'<p>IMC: <b>'+b+'</b></p>':'')+'<div class="row"><button class="go" onclick="saveMe()">Guardar datos</button></div></section>'}
function opt(v,t,c){return'<option value="'+v+'"'+(c===v?' selected':'')+'>'+t+'</option>'}
function calc(m){var w=m.l*.45359237,h=(m.f*12+(+m.i||0))*2.54;if(!(w>0&&h>0&&m.a>0&&m.x))return null;var b=10*w+6.25*h-5*m.a+(m.x==='h'?5:-161),k=b*1.55*(m.o==='b'?.85:m.o==='s'?1.1:1);k=Math.max(k,m.x==='h'?1500:1200);var p=Math.round(2*w),g=Math.round(.8*w),c=Math.max(50,Math.round((k-4*p-9*g)/4));return{k:Math.round(k/10)*10,p:p,c:c,g:g}}
function saveMe(){S.me={n:document.getElementById('mn').value.trim(),l:num('mw')||'',f:num('mf')||'',i:num('mi')||'',a:num('ma')||'',x:document.getElementById('ms').value,o:document.getElementById('mo').value};var g=calc(S.me);if(g)S.goals=Object.assign({},S.goals,g);save();ui();say(g?'Datos guardados. Metas del día calculadas.':'Datos guardados. Completa peso, estatura, edad y sexo para calcular tus metas.');render()}
function setTab(t){tab=t;say('');render();window.scrollTo(0,0)}
function T(a,b){return S.lang==='en'?b:a}
var SP='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true" style="flex:none;color:var(--blue)"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>';

function navHtml(){return'<nav>'+Object.keys(NV).map(function(k){var fb=(k==='comidas'||k==='rutina')&&tab===k?'<button class="fab'+(k==='comidas'?' first':'')+'" onclick="goForm()">'+(k==='rutina'?'Añadir serie':'Añadir comida')+'</button>':'';return'<div class="ni">'+fb+'<button class="'+(tab===k?'on':'')+'" onclick="setTab(\''+k+'\')"'+(tab===k?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+NV[k]+'</svg>'+NL[k]+'</button></div>'}).join('')+'</nav>'}
function bestBefore(n){var b=0;Object.keys(S.sets).forEach(function(d){if(d<day())S.sets[d].forEach(function(x){if(x.n.toLowerCase()===n.toLowerCase()&&x.w>b)b=x.w})});return b}
function coach(){var L=level(),s=S.sets[day()]||[],ls=[];
if(tab==='rutina'){
if(!s.length)ls.push(['s',T('Registra tu primera serie de hoy y te muestro tu marca anterior.','Log your first set today and I will show your previous best.')]);
else{var ex={};s.forEach(function(x){ex[x.n.toLowerCase()]=1});var ne=Object.keys(ex).length;
ls.push(['s',T('Llevas '+s.length+' series en '+ne+' ejercicios hoy.','You have '+s.length+' sets across '+ne+' exercises today.')]);
var pr=s.filter(function(x){var b=bestBefore(x.n);return b>0&&x.w>b})[0];
if(pr)ls.push(['c',T('Nueva marca en '+esc(pr.n)+': '+pr.w+' kg.','New personal best in '+esc(pr.n)+': '+pr.w+' kg.')])}
}else{
var t=totals(),g=S.goals;
if(!(S.meals[day()]||[]).length)ls.push(['s',T('Registra tu primera comida y te digo cuánto te falta.','Log your first meal and I will tell you what is left.')]);
else{var fp=Math.round(g.p-t.p),fk=Math.round(g.k-t.k);
ls.push(fp>0?['s',T('Te faltan '+fp+' g de proteína para tu meta.','You need '+fp+' g more protein to reach your goal.')]:['c',T('Ya llegaste a tu meta de proteína.','You reached your protein goal.')]);
ls.push(['s',fk>=0?T('Te quedan '+fk+' kcal de las '+g.k+' de hoy.','You have '+fk+' kcal left of '+g.k+' today.'):T('Pasaste tu meta por '+(-fk)+' kcal.','You are '+(-fk)+' kcal over your goal.')])}
}
ls.push(['s',T('Te faltan '+(L.n-L.x)+' XP para el nivel '+(L.l+1)+'.',(L.n-L.x)+' XP to reach level '+(L.l+1)+'.')]);
return'<section class="win hl coach"><h2>'+SP+'Coach</h2>'+ls.map(function(l){return'<p>'+(l[0]==='c'?CK:SP)+'<span>'+l[1]+'</span></p>'}).join('')+'</section>'}
function exRows(s){var g={},o=[];s.forEach(function(x,i){var k=x.n.toLowerCase();if(!g[k]){g[k]={n:x.n,a:[]};o.push(k)}g[k].a.push([x,i])});
return o.map(function(k){var e=g[k],l=last(e.n),seg='';for(var j=0;j<5;j++)seg+='<i class="'+(j<e.a.length?'f':'')+'"></i>';
return'<div class="ex"><div class="ic">'+DB+'</div><div class="gi"><b>'+esc(e.n)+'</b><small>'+(l?T('Última vez: ','Last time: ')+l:T('Primera vez que lo registras','First time logging this'))+'</small><div class="seg" role="img" aria-label="'+e.a.length+' '+T('series','sets')+'">'+seg+'</div><div class="chips">'+e.a.map(function(p){return'<button class="chip" onclick="delSet('+p[1]+')" aria-label="'+T('Borrar serie','Delete set')+'">'+p[0].w+' kg × '+p[0].r+' ✕</button>'}).join('')+'</div></div></div>'}).join('')}
function goForm(){var el=document.getElementById(tab==='rutina'?'en':'fn');if(!el)return;el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});el.focus({preventScroll:true})}
var TM={end:0,left:0,run:false,iv:0,ac:null,wl:null};
function fmt(sec){sec=Math.max(0,Math.ceil(sec));return Math.floor(sec/60)+':'+('0'+sec%60).slice(-2)}
function tmLeft(){return TM.run?Math.max(0,(TM.end-Date.now())/1000):TM.left}
function tmDraw(){var d=S.rest||90,l=tmLeft(),sh=l>0?l:d,e=document.getElementById('tmv');if(!e)return;e.textContent=fmt(sh);var c=document.getElementById('tmr');if(c)c.setAttribute('stroke-dasharray',(Math.min(sh/d,1)*263.9)+' 263.9');var b=document.getElementById('tmgo');if(b)b.textContent=tr(TM.run?'Pausa':(l>0&&l<d?'Seguir':'Iniciar'))}
function tmStop(){clearInterval(TM.iv);TM.run=false;try{if(TM.wl){TM.wl.release();TM.wl=null}}catch(e){}}
function tmBeep(){try{var a=TM.ac;if(!a)return;[0,.25,.5].forEach(function(t){var o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.15)})}catch(e){}}
function tmDone(){tmStop();TM.left=0;try{if(navigator.vibrate)navigator.vibrate([300,100,300])}catch(e){}tmBeep();try{if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(T('Descanso terminado','Rest is over'));u.lang=T('es-ES','en-US');speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){}say('¡Descanso terminado!');tmDraw()}
function tmTick(){if(tmLeft()<=0)tmDone();else tmDraw()}
function tmStart(){if(TM.run){TM.left=tmLeft();tmStop();tmDraw();return}
var d=S.rest||90;if(!(TM.left>0))TM.left=d;
if(!TM.ac){try{TM.ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
try{if(TM.ac&&TM.ac.state==='suspended')TM.ac.resume()}catch(e){}
TM.end=Date.now()+TM.left*1000;TM.run=true;clearInterval(TM.iv);TM.iv=setInterval(tmTick,250);
try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(w){TM.wl=w}).catch(function(){})}catch(e){}
tmDraw()}
function tmReset(){tmStop();TM.left=0;tmDraw()}
function tmSet(x){S.rest=x;save();tmStop();TM.left=0;render()}
function tmCustom(){var v=Math.round(num('tmc'));if(v>=5&&v<=3600)tmSet(v);else say('Escribe entre 5 y 3600 segundos.')}
function tmView(){var d=S.rest||90,pr=[30,45,60,90,120,180];
return'<section class="win hl tm"><h2>Timer</h2><p class="empty">Descanso entre series. Elige el tiempo y toca Iniciar.</p><div class="dial"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--line)" stroke-width="6"/><circle id="tmr" cx="50" cy="50" r="42" fill="none" stroke="var(--blue)" stroke-width="7" stroke-linecap="round" stroke-dasharray="263.9 263.9" transform="rotate(-90 50 50)"/></svg><b id="tmv" role="timer">'+fmt(d)+'</b></div><div class="row"><button id="tmgo" class="go" onclick="tmStart()">Iniciar</button><button onclick="tmReset()">Reiniciar</button></div></section><section class="win"><h2>Tiempo de descanso</h2><div class="chips">'+pr.map(function(x){return'<button class="chip'+(x===d?' sel':'')+'" onclick="tmSet('+x+')">'+fmt(x)+'</button>'}).join('')+'</div><div class="grid" style="margin-top:10px"><div><label for="tmc">Otro tiempo (segundos)</label><input id="tmc" type="number" inputmode="numeric"></div><div style="align-self:end"><button style="width:100%" onclick="tmCustom()">Fijar</button></div></div></section>'}
function gl(k){var d={f:28,s:2300,w:64};return S.goals[k]||d[k]}
function hourType(){var h=new Date().getHours();return h<11?'d':h<16?'a':h<21?'c':'m'}
function dAgo(n){var d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString('en-CA')}
var MT=[['d','Desayuno','Breakfast'],['a','Almuerzo','Lunch'],['c','Cena','Dinner'],['m','Merienda','Snack']];
function totalsOf(d){return(S.meals[d]||[]).reduce(function(a,f){a.k+=f.k;a.p+=f.p;a.c+=f.c;a.g+=f.g;a.fi+=f.fi||0;a.so+=f.so||0;return a},{k:0,p:0,c:0,g:0,fi:0,so:0})}
function selType(){var e=document.getElementById('ft');return e&&e.value?e.value:hourType()}
function addMeal(){var n=document.getElementById('fn').value.trim();if(!n){say('Escribe el nombre de la comida.');return}
var f={n:n,t:document.getElementById('ft').value,k:num('fk'),p:num('fp'),c:num('fc'),g:num('fg'),fi:num('ff'),so:num('fs')};(S.meals[day()]=S.meals[day()]||[]).push(f);add(10);checkMissions();render()}
function favSave(i){var f=(S.meals[day()]||[])[i];if(!f)return;var k=f.n.toLowerCase();if(S.fav.some(function(x){return x.n.toLowerCase()===k})){say(T('Ya está en tus favoritos.','Already in your favorites.'));return}S.fav.push({n:f.n,k:f.k,p:f.p,c:f.c,g:f.g,fi:f.fi||0,so:f.so||0});save();say(T('Guardada en favoritos.','Saved to favorites.'));render()}
function favAdd(i){var f=S.fav[i];if(!f)return;(S.meals[day()]=S.meals[day()]||[]).push({n:f.n,t:selType(),k:f.k,p:f.p,c:f.c,g:f.g,fi:f.fi,so:f.so});add(10);checkMissions();render()}
function favDel(i){S.fav.splice(i,1);save();render()}
function repeatYesterday(){var y=S.meals[dAgo(1)]||[];if(!y.length){say(T('Ayer no registraste comidas.','You logged no meals yesterday.'));return}var t=(S.meals[day()]=S.meals[day()]||[]);y.forEach(function(f){t.push(Object.assign({},f))});add(10);checkMissions();render()}
function addWater(oz){var d=day();S.water[d]=Math.max(0,(S.water[d]||0)+oz);save();checkMissions();render()}
function missions(){var d=day(),t=totalsOf(d),ns=(S.sets[d]||[]).length,nm=(S.meals[d]||[]).length,w=S.water[d]||0;
return[{id:'p',es:'Llega a tu meta de proteína',en:'Reach your protein goal',ok:S.goals.p>0&&t.p>=S.goals.p,v:Math.round(t.p)+' / '+S.goals.p+' g'},
{id:'s',es:'Registra 12 series',en:'Log 12 sets',ok:ns>=12,v:ns+' / 12'},
{id:'w',es:'Toma tu meta de agua',en:'Drink your water goal',ok:w>=gl('w'),v:w+' / '+gl('w')+' oz'},
{id:'c',es:'Registra 3 comidas',en:'Log 3 meals',ok:nm>=3,v:nm+' / 3'}]}
function checkMissions(){var d=day(),dn=(S.done[d]=S.done[d]||[]),got=[];missions().forEach(function(m){if(m.ok&&dn.indexOf(m.id)<0){dn.push(m.id);S.xp+=30;got.push(T(m.es,m.en))}});if(got.length){save();say(T('Misión cumplida: ','Quest complete: ')+got.join(', ')+' (+'+30*got.length+' XP)')}}
function active(d){return(S.meals[d]||[]).length>0||(S.sets[d]||[]).length>0}
function streak(){var n=0,i=active(dAgo(0))?0:1;while(i<400&&active(dAgo(i))){n++;i++}return n}
function week(){var r=[];for(var i=6;i>=0;i--){var d=dAgo(i),t=totalsOf(d);r.push({d:d,k:Math.round(t.k),p:t.p,s:(S.sets[d]||[]).length})}return r}
function calChart(){var w=week(),mx=Math.max(S.goals.k,Math.max.apply(null,w.map(function(x){return x.k})),1),H=100,B='';
w.forEach(function(x,i){var h=Math.round(x.k/mx*H),X=12+i*40;B+='<rect x="'+X+'" y="'+(H+8-h)+'" width="28" height="'+h+'" rx="4" fill="var(--blue)"/><text x="'+(X+14)+'" y="128" text-anchor="middle" font-size="11" fill="var(--mute)">'+x.d.slice(8)+'</text>'});
var gy=H+8-Math.round(S.goals.k/mx*H);
return'<svg viewBox="0 0 300 136" role="img" aria-label="'+esc(T('Calorías de los últimos 7 días','Calories over the last 7 days'))+'" style="width:100%"><line x1="6" x2="294" y1="'+gy+'" y2="'+gy+'" stroke="#f59e0b" stroke-dasharray="4 4"/>'+B+'</svg>'}
function wtChart(){var ks=Object.keys(S.weights).sort().slice(-30);if(ks.length<2)return'';var v=ks.map(function(k){return S.weights[k]}),mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),r=(mx-mn)||1,P=ks.map(function(k,i){return(10+i*(280/(ks.length-1))).toFixed(1)+','+(100-(S.weights[k]-mn)/r*80).toFixed(1)}).join(' ');
return'<svg viewBox="0 0 300 120" role="img" aria-label="'+esc(T('Peso corporal: de '+v[0]+' a '+v[v.length-1]+' lb','Body weight: from '+v[0]+' to '+v[v.length-1]+' lb'))+'" style="width:100%"><polyline points="'+P+'" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="10" y="116" font-size="11" fill="var(--mute)">'+mn+' lb</text><text x="290" y="14" text-anchor="end" font-size="11" fill="var(--mute)">'+mx+' lb</text></svg>'}
function records(){var b={};Object.keys(S.sets).sort().forEach(function(d){S.sets[d].forEach(function(x){var k=x.n.toLowerCase();if(!b[k]||x.w>=b[k].w)b[k]={n:x.n,w:x.w,r:x.r,d:d}})});return Object.keys(b).map(function(k){return b[k]}).sort(function(a,c){return a.n.toLowerCase()<c.n.toLowerCase()?-1:1})}
function saveWeight(){var v=num('wl');if(!(v>0)){say(T('Escribe tu peso en libras.','Enter your weight in pounds.'));return}S.weights[day()]=v;save();say(T('Peso guardado.','Weight saved.'));render()}
function saveRoutine(){var s=S.sets[day()]||[];if(!s.length){say(T('Registra series hoy para guardarlas como rutina.','Log sets today to save them as a routine.'));return}
var g={},o=[];s.forEach(function(x){var k=x.n.toLowerCase();if(!g[k]){g[k]={n:x.n,k:0,w:0,r:0};o.push(k)}g[k].k++;g[k].w=x.w;g[k].r=x.r});
var nm=document.getElementById('rn').value.trim()||T('Rutina ','Routine ')+(S.routines.length+1);
S.routines.push({name:nm,ex:o.map(function(k){return g[k]})});save();say(T('Rutina guardada.','Routine saved.'));render()}
function loadRoutine(i){var r=S.routines[i];if(!r)return;S.plan=r.ex.map(function(e){return Object.assign({},e)});save();tab='rutina';say(T('Plan cargado.','Plan loaded.'));render()}
function delRoutine(i){S.routines.splice(i,1);save();render()}
function planAdd(i){var p=S.plan[i];if(!p)return;(S.sets[day()]=S.sets[day()]||[]).push({n:p.n,w:p.w,r:p.r});add(15);checkMissions();render()}
function planClear(){S.plan=[];save();render()}
function planView(){if(!S.plan.length)return'';var s=S.sets[day()]||[];
return'<section class="win hl"><h2>'+T('Plan de hoy','Today’s plan')+'</h2>'+S.plan.map(function(p,i){var done=s.filter(function(x){return x.n.toLowerCase()===p.n.toLowerCase()}).length,seg='';for(var j=0;j<Math.min(p.k,10);j++)seg+='<i class="'+(j<done?'f':'')+'"></i>';
return'<div class="ex"><div class="ic">'+DB+'</div><div class="gi"><b>'+esc(p.n)+'</b><small>'+p.k+' × '+p.r+' · '+p.w+' kg · '+done+'/'+p.k+'</small><div class="seg" role="img" aria-label="'+done+'/'+p.k+'">'+seg+'</div></div><button class="chip" style="align-self:center" onclick="planAdd('+i+')">+ '+T('Serie','Set')+'</button></div>'}).join('')+'<div class="row"><button onclick="planClear()">'+T('Limpiar plan','Clear plan')+'</button></div></section>'}
function routinesView(){return'<section class="win"><h2>'+T('Rutinas guardadas','Saved routines')+'</h2>'+(S.routines.length?'<ul>'+S.routines.map(function(r,i){return'<li><span>'+esc(r.name)+'<small>'+r.ex.length+' '+T('ejercicios','exercises')+'</small></span><span class="row" style="margin:0;flex:none"><button class="chip" onclick="loadRoutine('+i+')">'+T('Cargar','Load')+'</button><button class="chip" onclick="delRoutine('+i+')" aria-label="'+T('Borrar rutina','Delete routine')+'">✕</button></span></li>'}).join('')+'</ul>':'<p class="empty">'+T('Aún no tienes rutinas. Registra series y guárdalas aquí con un nombre, por ejemplo Pecho o Piernas.','No routines yet. Log some sets and save them here with a name, like Chest or Legs.')+'</p>')+'<label for="rn" style="margin-top:10px">'+T('Nombre de la rutina','Routine name')+'</label><input id="rn" placeholder="'+T('Piernas','Legs')+'"><div class="row"><button onclick="saveRoutine()">'+T('Guardar series de hoy como rutina','Save today’s sets as a routine')+'</button></div></section>'}
function mealList(){var m=S.meals[day()]||[];if(!m.length)return'<p class="empty">'+T('Aún no registras comidas hoy. Añade la primera arriba.','No meals logged today. Add the first one above.')+'</p>';
return MT.map(function(x){var ix=[];m.forEach(function(f,i){if((f.t||'m')===x[0])ix.push(i)});if(!ix.length)return'';var kc=ix.reduce(function(a,i){return a+m[i].k},0);
return'<h3 class="grp">'+T(x[1],x[2])+' · '+Math.round(kc)+' kcal</h3><ul>'+ix.map(function(i){var f=m[i];return'<li><span>'+esc(f.n)+'<small>'+f.k+' kcal · P '+f.p+' · C '+f.c+' · G '+f.g+'</small></span><span class="row" style="margin:0;flex:none"><button class="chip" onclick="favSave('+i+')" aria-label="'+T('Guardar en favoritos','Save to favorites')+'">★</button><button class="chip" onclick="delMeal('+i+')" aria-label="'+T('Borrar','Delete')+' '+esc(f.n)+'">✕</button></span></li>'}).join('')+'</ul>'}).join('')}
function favView(){return'<section class="win"><h2>'+T('Favoritos','Favorites')+'</h2>'+(S.fav.length?'<ul>'+S.fav.map(function(f,i){return'<li><span>'+esc(f.n)+'<small>'+f.k+' kcal · P '+f.p+' · C '+f.c+' · G '+f.g+'</small></span><span class="row" style="margin:0;flex:none"><button class="chip" onclick="favAdd('+i+')">'+T('Añadir','Add')+'</button><button class="chip" onclick="favDel('+i+')" aria-label="'+T('Quitar de favoritos','Remove from favorites')+'">✕</button></span></li>'}).join('')+'</ul>':'<p class="empty">'+T('Toca la estrella en una comida registrada para guardarla aquí.','Tap the star on a logged meal to save it here.')+'</p>')+'</section>'}
function progView(){var ms=missions(),wk=week(),dt=wk.filter(function(x){return x.s>0}).length,ns=wk.reduce(function(a,x){return a+x.s},0),pp=wk.filter(function(x){return S.goals.p>0&&x.p>=S.goals.p}).length,rc=records();
var h='<section class="win hl"><h2>'+T('Misiones de hoy','Today’s quests')+'</h2><ul>'+ms.map(function(m){return'<li><span class="q">'+(m.ok?CK:'<i class="dot"></i>')+'<span>'+T(m.es,m.en)+'<small>'+m.v+' · +30 XP</small></span></span></li>'}).join('')+'</ul></section>';
h+='<section class="win"><h2>'+T('Racha y semana','Streak and week')+'</h2><div class="tot"><div><b>'+streak()+'</b><span>'+T('días de racha','day streak')+'</span></div><div><b>'+dt+'/7</b><span>'+T('días entrenados','days trained')+'</span></div><div><b>'+ns+'</b><span>'+T('series','sets')+'</span></div><div><b>'+pp+'/7</b><span>'+T('meta de proteína','protein goal')+'</span></div></div></section>';

h+='<section class="win"><h2>Añadir comida</h2><label for="fn">Comida</label><input id="fn" placeholder="Arroz con pollo"><label for="ft">'+T('Momento','Meal time')+'</label><select id="ft">'+MT.map(function(x){return'<option value="'+x[0]+'"'+(x[0]===hourType()?' selected':'')+'>'+T(x[1],x[2])+'</option>'}).join('')+'</select><div class="grid"><div><label for="fk">Calorías</label><input id="fk" type="number" inputmode="decimal"></div><div><label for="fp">Proteína (g)</label><input id="fp" type="number" inputmode="decimal"></div><div><label for="fc">Carbohidratos (g)</label><input id="fc" type="number" inputmode="decimal"></div><div><label for="fg">Grasa (g)</label><input id="fg" type="number" inputmode="decimal"></div><div><label for="ff">'+T('Fibra (g)','Fiber (g)')+'</label><input id="ff" type="number" inputmode="decimal"></div><div><label for="fs">'+T('Sodio (mg)','Sodium (mg)')+'</label><input id="fs" type="number" inputmode="decimal"></div></div><div class="row"><button class="go" onclick="addMeal()">Guardar comida</button></div></section>';
h+=searchView();h+=aiView('meal');
h+='<section class="win"><h2>Comidas registradas</h2>'+mealList()+'<div class="row"><button onclick="repeatYesterday()">'+T('Repetir comidas de ayer','Repeat yesterday’s meals')+'</button></div></section>';
h+=favView();h+=goals()}
else if(tab==='progreso'){h+=progView()+strView()+bodyView()+photoView()+chatView()}
else if(tab==='strategos'){h+=me()+aiKeyView()+backupView()}
else if(tab==='timer'){h+=tmView()}
else{var s=S.sets[day()]||[],names={};Object.keys(S.sets).forEach(function(d){S.sets[d].forEach(function(x){names[x.n]=1})});
h+=planView();
h+='<section class="win"><h2>Series de hoy</h2>'+(s.length?exRows(s)+'<div class="row"><button onclick="share()">Compartir día</button></div>':'<p class="empty">Toca el botón azul para registrar la primera serie.</p>')+'</section>';
h+='<section class="win"><h2>Añadir serie</h2><label for="en">Ejercicio</label><input id="en" list="ex" placeholder="Sentadilla"><datalist id="ex">'+Object.keys(names).map(function(n){return'<option value="'+esc(n)+'">'}).join('')+'</datalist><div class="grid"><div><label for="ew">Peso (kg)</label><input id="ew" type="number" inputmode="decimal"></div><div><label for="er">Repeticiones</label><input id="er" type="number" inputmode="numeric"></div></div><div class="row"><button class="go" onclick="addSet()">Guardar serie</button></div></section>';

h+=navHtml();

/* ---- Medidas, fotos, fuerza, plantillas ---- */
var BM=[['w','Cintura','Waist'],['c','Pecho','Chest'],['a','Brazo','Arm'],['t','Muslo','Thigh']];
function saveBody(){var o={},any=0;BM.forEach(function(m){var v=parseFloat((document.getElementById('bm'+m[0])||{}).value);if(v>0){o[m[0]]=v;any=1}});if(!any){say(T('Escribe al menos una medida en pulgadas.','Enter at least one measurement in inches.'));return}
var d=day();S.body[d]=Object.assign(S.body[d]||{},o);save();say(T('Medidas guardadas.','Measurements saved.'));render()}
function bodyView(){var ks=Object.keys(S.body).sort(),last={},first={},prev={};
ks.forEach(function(d){BM.forEach(function(m){var v=S.body[d][m[0]];if(v>0){if(!first[m[0]])first[m[0]]=v;prev[m[0]]=last[m[0]];last[m[0]]=v}})});
var tdy=S.body[day()]||{};
var h='<section class="win"><h2>'+T('Medidas corporales','Body measurements')+'</h2><div class="grid">'+BM.map(function(m){return'<div><label for="bm'+m[0]+'">'+T(m[1],m[2])+' (in)</label><input id="bm'+m[0]+'" type="number" inputmode="decimal" value="'+(tdy[m[0]]||'')+'"></div>'}).join('')+'</div><div class="row"><button class="go" onclick="saveBody()">'+T('Guardar medidas','Save measurements')+'</button></div>';
var got=BM.filter(function(m){return last[m[0]]});
if(got.length)h+='<ul style="margin-top:8px">'+got.map(function(m){var k=m[0],df=first[k]!==last[k]?(last[k]-first[k]):0,s=df?(df>0?'+':'')+(Math.round(df*10)/10)+' in':'—';return'<li><span>'+T(m[1],m[2])+'<small>'+T('Desde la primera medida: ','Since the first entry: ')+s+'</small></span><b>'+last[k]+' in</b></li>'}).join('')+'</ul>';
else h+='<p class="empty">'+T('Mide una vez por semana, siempre en el mismo punto y a la misma hora.','Measure once a week, at the same spot and time of day.')+'</p>';
return h+'</section>'}
function photoShrink(f){return new Promise(function(ok,no){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.7))};im.onerror=function(){no(new Error('img'))};im.src=u})}
function photoAdd(inp){var f=inp.files&&inp.files[0];if(!f)return;photoShrink(f).then(function(u){S.photos.push({d:day(),u:u});if(S.photos.length>12)S.photos.shift();try{localStorage.setItem('gl',JSON.stringify(S))}catch(e){S.photos.pop();say(T('No hay espacio para más fotos. Borra alguna.','No room for more photos. Delete one.'));return}say(T('Foto guardada.','Photo saved.'));inp.value='';render()},function(){say(T('No se pudo leer la foto.','Could not read the photo.'))})}
function photoDel(i){S.photos.splice(i,1);save();render()}
function photoView(){var p=S.photos,h='<section class="win"><h2>'+T('Fotos de progreso','Progress photos')+'</h2><label for="pf">'+T('Añadir foto','Add photo')+'</label><input id="pf" type="file" accept="image/*" onchange="photoAdd(this)">';
if(p.length>=2)h+='<h3 class="grp">'+T('Primera vs última','First vs latest')+'</h3><div class="grid"><div><img src="'+p[0].u+'" alt="'+T('Primera foto','First photo')+' '+p[0].d+'" style="width:100%;border-radius:10px"><small class="empty">'+p[0].d+'</small></div><div><img src="'+p[p.length-1].u+'" alt="'+T('Última foto','Latest photo')+' '+p[p.length-1].d+'" style="width:100%;border-radius:10px"><small class="empty">'+p[p.length-1].d+'</small></div></div>';
if(p.length)h+='<h3 class="grp">'+T('Todas','All')+' ('+p.length+'/12)</h3><div class="grid" style="grid-template-columns:repeat(3,1fr)">'+p.map(function(x,i){return'<div><img src="'+x.u+'" alt="'+x.d+'" style="width:100%;border-radius:8px"><small class="empty">'+x.d.slice(5)+'</small><button class="chip" style="width:100%" onclick="photoDel('+i+')" aria-label="'+T('Borrar foto','Delete photo')+' '+x.d+'">✕</button></div>'}).join('')+'</div>';
else h+='<p class="empty">'+T('Las fotos se guardan solo en este celular (máximo 12).','Photos stay on this phone only (max 12).')+'</p>';
return h+'</section>'}
function strData(n){var o=[];Object.keys(S.sets).sort().forEach(function(d){var b=0,r=0;S.sets[d].forEach(function(x){if(x.n.toLowerCase()===n.toLowerCase()&&x.w>b){b=x.w;r=x.r}});if(b>0)o.push({d:d,w:b,r:r})});return o}
function strSel(v){S.sx=v;save();render()}
function strView(){var names={};Object.keys(S.sets).forEach(function(d){S.sets[d].forEach(function(x){if(x.w>0)names[x.n.toLowerCase()]=x.n})});var ks=Object.keys(names).sort();
var h='<section class="win"><h2>'+T('Fuerza por ejercicio','Strength by exercise')+'</h2>';
if(!ks.length)return h+'<p class="empty">'+T('Registra series con peso para ver tu progreso por ejercicio.','Log weighted sets to see your progress per exercise.')+'</p></section>';
var cur=(S.sx&&names[S.sx.toLowerCase()])?S.sx.toLowerCase():ks[0];
h+='<label for="sx">'+T('Ejercicio','Exercise')+'</label><select id="sx" onchange="strSel(this.value)">'+ks.map(function(k){return'<option value="'+esc(k)+'"'+(k===cur?' selected':'')+'>'+esc(names[k])+'</option>'}).join('')+'</select>';
var d=strData(cur).slice(-20);
if(d.length<2)return h+'<p class="empty">'+T('Hazlo en dos días distintos para ver la gráfica.','Do it on two different days to see the chart.')+'</p></section>';
var v=d.map(function(x){return x.w}),mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),r=(mx-mn)||1,P=d.map(function(x,i){return(10+i*(280/(d.length-1))).toFixed(1)+','+(100-(x.w-mn)/r*80).toFixed(1)}).join(' ');
var rm=Math.round(Math.max.apply(null,d.map(function(x){return x.w*(1+x.r/30)})));
h+='<svg viewBox="0 0 300 120" role="img" aria-label="'+esc(T('Peso máximo de '+names[cur]+': de '+v[0]+' a '+v[v.length-1]+' kg','Top weight for '+names[cur]+': from '+v[0]+' to '+v[v.length-1]+' kg'))+'" style="width:100%"><polyline points="'+P+'" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="10" y="116" font-size="11" fill="var(--mute)">'+mn+' kg</text><text x="290" y="14" text-anchor="end" font-size="11" fill="var(--mute)">'+mx+' kg</text></svg><p class="empty">'+T('Mejor serie de cada día. 1RM estimado: ','Best set of each day. Estimated 1RM: ')+'<b>'+rm+' kg</b></p></section>';
return h}
var TPL=[
['Empuje','Push',[['Press de banca','Bench press',4,8],['Press inclinado con mancuernas','Incline dumbbell press',3,10],['Press militar','Overhead press',3,8],['Elevaciones laterales','Lateral raises',3,12],['Extensión de tríceps','Triceps extension',3,12]]],
['Tirón','Pull',[['Dominadas','Pull-ups',4,8],['Remo con barra','Barbell row',4,8],['Jalón al pecho','Lat pulldown',3,10],['Curl con barra','Barbell curl',3,10],['Face pull','Face pull',3,15]]],
['Pierna','Legs',[['Sentadilla','Squat',4,8],['Peso muerto rumano','Romanian deadlift',3,10],['Prensa de pierna','Leg press',3,12],['Curl femoral','Leg curl',3,12],['Elevación de talones','Calf raises',4,15]]],
['Cuerpo completo','Full body',[['Sentadilla','Squat',3,8],['Press de banca','Bench press',3,8],['Remo con barra','Barbell row',3,8],['Press militar','Overhead press',3,10],['Peso muerto rumano','Romanian deadlift',3,10]]],
['Torso','Upper body',[['Press de banca','Bench press',4,8],['Remo con barra','Barbell row',4,8],['Press militar','Overhead press',3,10],['Jalón al pecho','Lat pulldown',3,10],['Curl con barra','Barbell curl',3,12],['Extensión de tríceps','Triceps extension',3,12]]]];
function lastW(n){var w=0;Object.keys(S.sets).sort().forEach(function(d){S.sets[d].forEach(function(x){if(x.n.toLowerCase()===n.toLowerCase())w=x.w})});return w}
function tplLoad(i){var t=TPL[i];if(!t)return;S.plan=t[2].map(function(e){var n=T(e[0],e[1]);return{n:n,k:e[2],r:e[3],w:lastW(n)}});save();tab='rutina';say(T('Plan cargado. Ajusta los pesos al registrar.','Plan loaded. Adjust weights as you log.'));render()}
function tplView(){return'<section class="win"><h2>'+T('Rutinas listas','Ready-made routines')+'</h2><p class="empty">'+T('Toca una para cargarla como plan de hoy. Usa el último peso que registraste en cada ejercicio.','Tap one to load it as today’s plan. It uses the last weight you logged for each exercise.')+'</p><ul>'+TPL.map(function(t,i){return'<li><span>'+T(t[0],t[1])+'<small>'+t[2].length+' '+T('ejercicios','exercises')+'</small></span><button class="chip" onclick="tplLoad('+i+')">'+T('Cargar','Load')+'</button></li>'}).join('')+'</ul></section>'}

if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
window.addEventListener('offline',function(){say(T('Sin internet: la app sigue funcionando; la búsqueda de comida y la IA no.','Offline: the app still works; food search and AI do not.'))});
window.addEventListener('online',function(){say(T('Conexión recuperada.','Back online.'))});
load();theme();ui();render();
