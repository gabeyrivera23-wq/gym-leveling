<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>GYM Leveling</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#030a1c">

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--panel:#eef3ff;--ink:#0b1430;--mute:#44537a;--blue:#1f5bff;--line:#bccdff;--glow:rgba(31,91,255,.15);--onblue:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050914;--panel:#0a1530;--ink:#eaf1ff;--mute:#a9bbe6;--blue:#3d8bff;--line:#1c3a78;--glow:rgba(61,139,255,.35);--onblue:#031030}}
:root[data-theme="dark"]{--bg:#050914;--panel:#0a1530;--ink:#eaf1ff;--mute:#a9bbe6;--blue:#3d8bff;--line:#1c3a78;--glow:rgba(61,139,255,.35);--onblue:#031030}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rajdhani',system-ui,sans-serif;font-weight:500;font-size:18px;line-height:1.35}
main{max-width:520px;margin:0 auto;padding:14px 14px 210px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ttl{flex:1;min-width:0}header h1{font-size:26px;font-weight:700;margin:0;letter-spacing:.5px;line-height:1.1}#un{display:block;font-size:15px;color:var(--mute)}
.logo{width:72px;height:72px;color:var(--blue);filter:drop-shadow(0 0 6px var(--glow))}
.win{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.win h2{font-size:18px;font-weight:700;margin:0 0 8px;color:var(--blue)}
.lvl{display:flex;align-items:baseline;gap:10px}
.lvl b{font-size:44px;line-height:1;color:var(--blue);text-shadow:0 0 12px var(--glow)}
.bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue);box-shadow:0 0 8px var(--blue)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
nav button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;padding:4px 8px;border:0;border-radius:16px;background:transparent;color:var(--mute);font-size:14px}
nav button svg{width:26px;height:26px}
nav button.on{background:var(--line);color:var(--blue)}
.ni{flex:1;position:relative;display:flex;justify-content:center;max-width:140px}
.ni>button:not(.fab){width:100%}
nav .fab{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 10px);z-index:4;display:block;flex:none;width:auto;max-width:none;white-space:nowrap;min-height:40px;padding:4px 20px;border:0;border-radius:999px;background:var(--blue);color:var(--onblue);font-size:16px;box-shadow:0 4px 12px var(--glow)}
nav .fab.first{left:0;transform:none}
.win.hl{border:1.5px solid var(--blue);box-shadow:0 0 18px var(--glow),inset 0 0 14px var(--glow)}
.coach h2{display:flex;align-items:center;gap:8px}
.coach p{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.ex{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .ic{flex:none;width:52px;height:52px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--blue)}
.ex .gi{flex:1;min-width:0}
.ex small{display:block;color:var(--mute);font-size:15px}
.seg{display:flex;gap:3px;margin-top:6px}
.seg i{width:18px;height:8px;border-radius:2px;background:var(--line)}
.seg i.f{background:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-height:36px;padding:2px 12px;font-size:15px;border:1px solid var(--line);border-radius:999px;color:var(--ink)}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;border:1.5px solid var(--blue);background:transparent;color:var(--blue);padding:8px 14px;min-height:44px}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.on,button.go{background:var(--blue);color:var(--onblue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select{font:inherit;width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
label{font-size:15px;color:var(--mute);display:block}
.tot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.tot b{display:block;font-size:26px;color:var(--blue)}
.tot span{font-size:14px;color:var(--mute)}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ring{text-align:center}.ring>div{font-weight:700}.ring svg{width:100%;max-width:130px;display:block;margin:0 auto}.ring text{fill:var(--ink);text-anchor:middle}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
li small{color:var(--mute);display:block;font-size:15px}
li button{min-height:36px;padding:2px 10px;font-size:15px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row button{flex:1}
.empty{color:var(--mute);margin:4px 0}
#msg{position:fixed;left:16px;right:16px;bottom:calc(var(--qb) + 70px);z-index:8;text-align:center;pointer-events:none;color:var(--blue);font-weight:700}#msg:not(:empty){background:var(--bg);border:1px solid var(--blue);border-radius:12px;padding:10px 14px;box-shadow:0 4px 18px rgba(0,0,0,.45)}
.dial{position:relative;width:210px;max-width:70%;margin:8px auto}
.dial svg{width:100%;display:block}
.dial b{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;color:var(--ink)}
.chip.sel{background:var(--blue);color:var(--onblue);border-color:var(--blue)}
.foot{display:flex;align-items:center;gap:12px;margin-top:8px}
.foot button{flex:none}
.note{margin:0;color:var(--mute);font-size:15px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}
.mini b{font-size:22px;color:var(--blue)}
.mini small{display:block;color:var(--mute);font-size:14px}
.grp{font-size:16px;font-weight:600;margin:12px 0 2px;color:var(--mute)}
.q{display:flex;gap:10px;align-items:flex-start}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
textarea{font:inherit;font-size:14px;width:100%;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ans{white-space:pre-wrap;margin:8px 0}

:root{--qb:calc(76px + env(safe-area-inset-bottom,0px))}
body.typing{--qb:8px}body.typing nav{display:none}
#qa{position:fixed;left:12px;right:12px;bottom:var(--qb);max-width:496px;margin:0 auto;z-index:5;display:flex;align-items:center;gap:6px;padding:5px 6px;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;box-shadow:0 4px 18px var(--glow)}
#qa[hidden],#qd[hidden],#qm[hidden]{display:none}
#qa input#qi{flex:1;min-width:0;border:0;background:transparent;font-size:17px;padding:0 6px;min-height:44px;border-radius:0}
#qa input#qi:focus-visible{outline:0}#qa:focus-within{border-color:var(--blue)}
.qb{flex:none;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1.5px solid var(--line);color:var(--blue)}
.qb.go{background:var(--blue);color:var(--onblue);border-color:var(--blue)}.qb.on{background:#ff2d6f;border-color:#ff2d6f;color:#fff}
#qm{position:fixed;left:12px;bottom:calc(var(--qb) + 62px);z-index:7;min-width:240px;padding:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:2px}
#qm button{text-align:left;border:0;border-radius:10px;padding:10px 12px;min-height:44px;background:transparent;color:var(--ink);font-weight:600}
#qd{position:fixed;left:12px;right:12px;bottom:calc(var(--qb) + 62px);max-width:496px;margin:0 auto;z-index:6;max-height:50vh;overflow:auto;padding:12px 14px;background:var(--panel);border:1.5px solid var(--blue);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.tg{display:inline-block;font-size:13px;color:var(--blue);margin-right:6px}
#ud{position:fixed;left:16px;right:16px;bottom:calc(var(--qb) + 120px);z-index:9;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--blue);border-radius:12px;padding:8px 12px;box-shadow:0 4px 18px rgba(0,0,0,.45)}
#ud[hidden],#rp[hidden],#ed[hidden]{display:none}
#rp{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:12px;z-index:9;background:var(--blue);color:var(--onblue);border:0;border-radius:999px;padding:6px 14px;font-weight:700;min-height:36px}
#ed{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px}#ed .win{width:100%;max-width:420px;max-height:90vh;overflow:auto;margin:0}
.ck{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.ck input{width:22px;min-height:22px;height:22px;flex:none;margin-top:2px}

.bar i{position:relative;overflow:hidden;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:xpshine 3s ease-in-out infinite}
@keyframes xpshine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.rk{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rc,var(--blue));color:var(--rc,var(--blue));border-radius:999px;padding:2px 12px;font-weight:700;font-size:15px;box-shadow:0 0 10px var(--rc,var(--glow))}
.lvl{flex-wrap:wrap}.lvl .xt{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
#lu{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(8,30,80,.88),rgba(0,0,0,.94));animation:luin .35s ease-out}
#lu[hidden]{display:none}
#lu .bx{position:relative;text-align:center;color:#fff;padding:24px;max-width:340px}
#lu .ring{position:absolute;left:50%;top:92px;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;border:3px solid var(--rc,#1fa2ff);opacity:0;animation:luring 1.8s ease-out infinite}
#lu .ring.r2{animation-delay:.6s}#lu .ring.r3{animation-delay:1.2s}
#lu .tt{font-size:15px;letter-spacing:.35em;color:var(--rc,#1fa2ff);font-weight:700;animation:luup .6s .1s both}
#lu .nm{font-size:120px;line-height:1.05;font-weight:800;color:#fff;text-shadow:0 0 18px var(--rc,#1fa2ff),0 0 50px var(--rc,#1fa2ff);animation:lupop .8s cubic-bezier(.2,1.6,.4,1) .15s both}
#lu .lb{font-size:18px;margin-top:4px;animation:luup .6s .5s both}
#lu .nr{display:inline-block;margin:10px 0 4px;padding:4px 16px;border:2px solid var(--rc,#1fa2ff);border-radius:999px;color:var(--rc,#1fa2ff);font-weight:800;letter-spacing:.12em;animation:lupop .6s 1s both}
#lu button{margin-top:22px;min-width:160px;animation:luup .6s 1.1s both}
@keyframes luin{from{opacity:0}to{opacity:1}}
@keyframes lupop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes luup{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes luring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.bar i,.bar i::after,#lu,#lu *{animation:none!important;transition:none!important}}
.i{width:1.15em;height:1.15em;vertical-align:-.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip .i{width:18px;height:18px;vertical-align:-4px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
details.fold>summary::-webkit-details-marker{display:none}details.fold>summary h2{margin:0}
details.fold>summary::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.fold[open]>summary::after{transform:rotate(-135deg)}details.fold[open]>summary{margin-bottom:6px}
details.fold>summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:8px}
.hero{padding:18px 16px;border-color:var(--blue);box-shadow:0 0 22px var(--glow)}
.rings.hr{grid-template-columns:repeat(3,1fr);gap:10px}.hr .ring:first-child{grid-column:1/-1}.hr .ring:first-child svg{max-width:170px}.hr .ring svg{max-width:112px}
button{transition:transform .12s ease,background-color .15s,box-shadow .15s}button:active{transform:scale(.96)}
@keyframes pop{0%{transform:scale(.92);box-shadow:0 0 0 0 var(--glow)}55%{transform:scale(1.03);box-shadow:0 0 18px 2px var(--glow)}100%{transform:none;box-shadow:none}}.pop{animation:pop .65s ease}
@keyframes tabin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#app.tabin>*:not(nav){animation:tabin .32s ease both}#app.tabin>*:nth-child(2){animation-delay:.04s}#app.tabin>*:nth-child(3){animation-delay:.08s}#app.tabin>*:nth-child(4){animation-delay:.12s}#app.tabin>*:nth-child(n+5){animation-delay:.16s}
@keyframes drawl{to{stroke-dashoffset:0}}@keyframes fadein{from{opacity:0}to{opacity:1}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#app.tabin .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawl 1s ease forwards}#app.tabin .area{animation:fadein .9s ease both}
#app.tabin .bar-r{transform-box:fill-box;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
svg [role=button]{cursor:pointer}svg [role=button]:focus-visible{outline:2px solid var(--blue)}
@media (prefers-reduced-motion:reduce){.pop,#app.tabin>*,#app.tabin .draw,#app.tabin .area,#app.tabin .bar-r,button{animation:none!important;transition:none!important}#app.tabin .draw{stroke-dasharray:none;stroke-dashoffset:0}}

.dn{display:flex;align-items:center;gap:6px;justify-content:space-between}.dn b{flex:1;text-align:center;font-size:16px;text-transform:none}.dn button{min-width:44px}.dn input[type=date]{max-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.cal span{font-size:12px;color:var(--mute);text-align:center}
.cal button{min-height:40px;padding:0;border:1px solid var(--line);border-radius:10px;font-size:14px;position:relative;background:transparent;color:var(--ink)}
.cal button.t{background:var(--blue);color:var(--onblue);border-color:var(--blue);font-weight:700}.cal button.m:not(.t)::after{content:'';position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--blue)}
.cal button.n{box-shadow:0 0 0 2px var(--glow) inset;border-color:var(--blue)}.cal i{visibility:hidden}
.rmt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.rmt div{border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:13px;color:var(--mute)}.rmt b{display:block;font-size:16px;color:var(--ink)}
.past{border-color:#f59e0b}

.dn.x{}.cmp{padding:8px 10px}.dl{position:relative;flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:12px}.dl b{flex:none;font-size:16px}.dl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.seg2{display:flex;gap:6px;margin-bottom:12px}.seg2 button{flex:1}
.emp{text-align:center;padding:10px 0}.emp svg{width:64px;height:64px;stroke:var(--blue);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.85}.emp .empty{margin:6px 0 0}
.empty{font-size:15px}.tot span,.mini small{font-size:15px}
button.go{min-height:48px}.row{gap:8px}
.ring.ok svg{filter:drop-shadow(0 0 6px var(--rc))}.ring.ok>div{color:var(--rc)}
#app.tabin .ring circle:nth-of-type(2){animation:ringin 1s cubic-bezier(.2,.8,.2,1) both}@keyframes ringin{from{stroke-dasharray:0 264}}
.cal button.t{background:linear-gradient(135deg,var(--blue),#4db3ff);box-shadow:0 0 8px var(--glow)}
.cal button.s{box-shadow:0 0 12px 2px var(--blue);animation:sparkle 2.4s ease-in-out infinite}@keyframes sparkle{50%{box-shadow:0 0 18px 4px #4db3ff;filter:brightness(1.15)}}
body.cp .win{padding:10px 12px;margin-bottom:8px}body.cp h2{font-size:18px;margin-bottom:6px}body.cp .rings.hr svg{max-width:90px}body.cp .hr .ring:first-child svg{max-width:120px}body.cp li small{font-size:14px}
@media (prefers-reduced-motion:reduce){.cal button.s,#app.tabin .ring circle{animation:none!important}}
</style></head>

(S.sets[day()]=S.sets[day()]||[]).push({n:n,w:num('ew'),r:num('er')});add(15);checkMissions();render()}
function delSet(i){S.sets[day()].splice(i,1);save();render()}
function last(n){var ds=Object.keys(S.sets).filter(function(d){return d<day()}).sort().reverse();
for(var i=0;i<ds.length;i++){var s=S.sets[ds[i]].filter(function(x){return x.n.toLowerCase()===n.toLowerCase()});
if(s.length){var b=s.reduce(function(a,x){return x.w>a.w?x:a});return b.w+' lb × '+b.r}}return ''}

(S.meals[day()]||[]).forEach(function(f){o+='- '+f.n+': '+f.k+' kcal, P '+f.p+' g, C '+f.c+' g, G '+f.g+' g\n'});
o+='Total: '+t.k+' kcal, P '+t.p+' g, C '+t.c+' g, G '+t.g+' g\n\nEntrenamiento:\n';
(S.sets[day()]||[]).forEach(function(s){o+='- '+s.n+': '+s.w+' lb × '+s.r+'\n'});return tr(o)}

function me(){var m=S.me,b=m.l>0&&m.f>0?(m.l*.45359237/Math.pow((m.f*12+(+m.i||0))*.0254,2)).toFixed(1):'';return'<section class="win"><h2>Datos del usuario</h2><label for="mn">Nombre</label><input id="mn" value="'+esc(m.n)+'"><label for="mw">Peso corporal (lb)</label><input id="mw" type="number" inputmode="decimal" value="'+(m.l||'')+'"><div class="grid"><div><label for="mf">Estatura (pies)</label><input id="mf" type="number" inputmode="numeric" value="'+(m.f||'')+'"></div><div><label for="mi">Pulgadas</label><input id="mi" type="number" inputmode="decimal" value="'+(m.i||'')+'"></div></div><div class="grid"><div><label for="ma">Edad</label><input id="ma" type="number" inputmode="numeric" value="'+(m.a||'')+'"></div><div><label for="ms">Sexo</label><select id="ms">'+opt('','Elige',m.x||'')+opt('h','Hombre',m.x)+opt('m','Mujer',m.x)+'</select></div></div><label for="mo">Objetivo</label><select id="mo">'+opt('b','Bajar peso',m.o)+opt('m','Mantener',m.o||'m')+opt('s','Subir masa',m.o)+'</select><label for="mac">'+T('Nivel de actividad','Activity level')+'</label><select id="mac">'+opt('s',T('Sedentario (casi sin ejercicio)','Sedentary (little exercise)'),m.ac||'m')+opt('l',T('Ligera (1-3 días por semana)','Light (1-3 days a week)'),m.ac||'m')+opt('m',T('Moderada (3-5 días)','Moderate (3-5 days)'),m.ac||'m')+opt('a',T('Alta (6-7 días)','High (6-7 days)'),m.ac||'m')+'</select><div class="grid"><div><label for="mg">'+T('Peso meta (lb)','Goal weight (lb)')+'</label><input id="mg" type="number" inputmode="decimal" value="'+(m.gw||'')+'"></div><div><label for="mt">'+T('En cuántas semanas','In how many weeks')+'</label><input id="mt" type="number" inputmode="numeric" value="'+(m.gt||'')+'"></div></div>'+(m.gw>0&&m.gt>0&&weeksLeft()<=0?'<p class="empty">'+T('Tu plazo ya venció. Pon un peso meta y unas semanas nuevas para recalcular.','Your deadline has passed. Enter a new goal weight and weeks to recalculate.')+'</p>':goalPlanView(meEff()))+'<p class="empty">Las metas se calculan al guardar, con la fórmula Mifflin-St Jeor y tu nivel de actividad. Son estimaciones, no un plan médico.</p>'+(b?'<p>IMC: <b>'+b+'</b></p>':'')+'<div class="row"><button class="go" onclick="saveMe()">Guardar datos</button></div></section>'}
function opt(v,t,c){return'<option value="'+v+'"'+(c===v?' selected':'')+'>'+t+'</option>'}
function actF(m){return{s:1.2,l:1.375,m:1.55,a:1.725}[m.ac||'m']||1.55}
function curW(){var ks=Object.keys(S.weights).sort();return ks.length?+S.weights[ks[ks.length-1]]:(+S.me.l||0)}
function weeksLeft(){var m=S.me;if(!(m.gt>0))return 0;var el=m.gs?Math.floor((new Date(realDay()+'T00:00')-new Date(m.gs+'T00:00'))/864e5)/7:0;return m.gt-el}
function meEff(){var m=Object.assign({},S.me),w=curW();if(w>0)m.l=w;if(m.gw>0&&m.gt>0)m.gt=Math.max(1,Math.ceil(weeksLeft()));return m}
function planOf(m){var l=+m.l,gw=+m.gw,t=+m.gt;if(!(l>0&&gw>0&&t>0))return null;var d=gw-l;if(Math.abs(d)<.5)return{same:true};
var w=l*.45359237,h=(m.f*12+(+m.i||0))*2.54;if(!(h>0&&m.a>0&&m.x))return{need:true};
var tdee=(10*w+6.25*h-5*m.a+(m.x==='h'?5:-161))*actF(m),wk=d/t,cap=d<0?-Math.min(2,l*.01):1,lim=false;if(Math.abs(wk)>Math.abs(cap)){wk=cap;lim=true}
var k=tdee+wk*500,fl=m.x==='h'?1500:1200;if(k<fl){k=fl;lim=true}
var ew=(k-tdee)/500,weeks=(d<0&&ew<-.05)||(d>0&&ew>.05)?Math.ceil(d/ew):0;
return{d:d,tdee:tdee,k:k,wk:ew,lim:lim,weeks:weeks,req:t}}
function calc(m){var w=m.l*.45359237,h=(m.f*12+(+m.i||0))*2.54;if(!(w>0&&h>0&&m.a>0&&m.x))return null;var pl=planOf(m),b=10*w+6.25*h-5*m.a+(m.x==='h'?5:-161),k,p;
if(pl&&pl.k){k=Math.max(pl.k+(+m.adj||0),m.x==='h'?1500:1200);var gk=m.gw*.45359237;p=Math.round((pl.d<0?2.2:2)*(pl.d<0?(w+gk)/2:w))}else{k=b*actF(m)*(m.o==='b'?.85:m.o==='s'?1.1:1);k=Math.max(k,m.x==='h'?1500:1200);p=Math.round(2*w)}
var g=Math.round(.8*w),c=Math.max(50,Math.round((k-4*p-9*g)/4));return{k:Math.round(k/10)*10,p:p,c:c,g:g}}
function goalPlanView(m){var p=planOf(m);if(!p)return'';var o='';
if(p.same)return'<p class="empty">'+T('Tu peso meta es igual al actual: las calorías se calculan para mantener.','Your goal weight equals your current one: calories are set to maintain.')+'</p>';
if(p.need)return'<p class="empty">'+T('Completa estatura, edad y sexo para calcular el plan hacia tu meta.','Fill in height, age and sex to calculate your plan.')+'</p>';
var lose=p.d<0,ab=Math.abs(p.d),wk=Math.abs(p.wk),kc=Math.abs(Math.round(p.wk*500/10)*10),end=new Date(Date.now()+(p.weeks||p.req)*7*864e5).toLocaleDateString(T('es-ES','en-US'),{day:'numeric',month:'short',year:'numeric'});
o+='<p><b>'+T('Plan hacia tu meta','Plan to your goal')+'</b></p><p>'+T((lose?'Bajar ':'Subir ')+(Math.round(ab*10)/10)+' lb en '+p.req+' semanas.',(lose?'Lose ':'Gain ')+(Math.round(ab*10)/10)+' lb in '+p.req+' weeks.')+'</p>';
if(+m.adj){o+='<p class="empty">'+T('Incluye un ajuste de '+(m.adj>0?'+':'')+m.adj+' kcal por estancamiento.','Includes a '+(m.adj>0?'+':'')+m.adj+' kcal adjustment for a stall.')+'</p>'}
if(p.weeks){o+='<p>'+T('Ritmo: '+(Math.round(wk*10)/10)+' lb por semana. '+(lose?'Déficit':'Superávit')+' aprox. '+kc+' kcal al día.','Pace: '+(Math.round(wk*10)/10)+' lb per week. '+(lose?'Deficit':'Surplus')+' about '+kc+' kcal a day.')+'</p><p>'+T('Meta diaria: '+(Math.round(Math.max(p.k+(+m.adj||0),m.x==='h'?1500:1200)/10)*10)+' kcal.','Daily goal: '+(Math.round(Math.max(p.k+(+m.adj||0),m.x==='h'?1500:1200)/10)*10)+' kcal.')+'</p>'}
if(p.lim){o+='<p class="empty">'+(p.weeks?T('Ajusté el ritmo a un límite seguro ('+(lose?'máx. 1% de tu peso por semana (hasta 2 lb) y mínimo de calorías':'máx. 1 lb por semana')+'). Llegarías en unas '+p.weeks+' semanas, cerca del '+end+'.','I capped the pace at a safe limit ('+(lose?'max 1% of body weight per week (up to 2 lb) and a calorie floor':'max 1 lb per week')+'). You would arrive in about '+p.weeks+' weeks, around '+end+'.'):T('Con el mínimo seguro de calorías no se puede bajar a ese ritmo. Usa más semanas o más ejercicio.','You cannot lose at that pace with the safe calorie minimum. Use more weeks or more activity.'))+'</p>'}
else o+='<p class="empty">'+T('Fecha estimada: '+end+'.','Estimated date: '+end+'.')+'</p>';
return o}
function saveMe(){var pv=S.me||{},nl=num('mw')||'',ngw=num('mg')||'',ngt=num('mt')||'',same=pv.gw&&pv.gw==ngw&&pv.gt==ngt&&pv.gs;
S.me={n:document.getElementById('mn').value.trim(),l:nl,f:num('mf')||'',i:num('mi')||'',a:num('ma')||'',x:document.getElementById('ms').value,o:document.getElementById('mo').value,ac:document.getElementById('mac').value,gw:ngw,gt:ngt,gs:same?pv.gs:day(),g0:same?pv.g0:nl,adj:same?(pv.adj||0):0,adjd:same?(pv.adjd||''):''};
if(nl>0&&nl!=pv.l)S.weights[day()]=nl;
if(S.me.gw>0&&S.me.gt>0&&S.me.l>0){S.me.o=S.me.gw<S.me.l-.4?'b':S.me.gw>S.me.l+.4?'s':'m'}var g=calc(meEff());if(g)S.goals=Object.assign({},S.goals,g);save();ui();say(g?'Datos guardados. Metas del día calculadas.':'Datos guardados. Completa peso, estatura, edad y sexo para calcular tus metas.');render()}

function coach(){var L=level(),s=S.sets[day()]||[],ls=[];
if(tab==='rutina'){
if(!s.length)ls.push(['s',T('Registra tu primera serie de hoy y te muestro tu marca anterior.','Log your first set today and I will show your previous best.')]);

w.forEach(function(x,i){var h=Math.max(x.k>0?3:0,Math.round(x.k/mx*H)),X=12+i*40,Yt=H+8-h,lb=new Date(x.d+'T00:00').toLocaleDateString(nm,{weekday:'short',day:'numeric',month:'short'})+' · '+x.k+' kcal',over=x.k>S.goals.k*1.05;
B+='<rect class="bar-r" x="'+X+'" y="'+Yt+'" width="28" height="'+h+'" rx="5" fill="'+(over?'#f59e0b':'url(#cb)')+'" tabindex="0" role="button" aria-label="'+esc(lb)+'" data-x="'+(X+14)+'" data-y="'+Yt+'" data-t="'+esc(lb)+'" onclick="chTip(this)" onkeydown="chKey(event,this)" style="animation-delay:'+(i*45)+'ms"/><text x="'+(X+14)+'" y="128" text-anchor="middle" font-size="11" fill="var(--mute)" pointer-events="none">'+x.d.slice(8)+'</text>';if(i===w.length-1)tp='<text class="tip" x="'+Math.min(255,Math.max(45,X+14))+'" y="'+Math.max(11,Yt-10)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke">'+esc(lb)+'</text>'});
return'<svg viewBox="0 0 300 136" role="group" aria-label="'+esc(T('Calorías de los últimos 7 días','Calories over the last 7 days'))+'" style="width:100%"><defs><linearGradient id="cb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4db3ff"/><stop offset="1" stop-color="var(--blue)"/></linearGradient></defs><line x1="6" x2="294" y1="'+gy+'" y2="'+gy+'" stroke="#f59e0b" stroke-dasharray="4 4"/><line class="gd" y1="12" y2="'+(H+8)+'" stroke="var(--mute)" stroke-dasharray="2 3" style="visibility:hidden"/>'+B+tp+'</svg>'}

/* ---- Días anteriores, calendario, 1RM, progresión e imagen ---- */
function cf(x){return x.charAt(0).toUpperCase()+x.slice(1)}
function fmtD(d){return cf(new Date(d+'T00:00').toLocaleDateString(S.lang==='en'?'en-US':'es-ES',{weekday:'short',day:'numeric',month:'short'}))}
function vdSet(d){VD=(d&&d<realDay())?d:'';render()}
function vdGo(n){var d=new Date(day()+'T00:00');d.setDate(d.getDate()+n);vdSet(d.toLocaleDateString('en-CA'))}
function vdPick(v){if(/^\d{4}-\d{2}-\d{2}$/.test(v))vdSet(v)}
function dayNav(){var d=day(),p=isPast();
return'<section class="win cmp'+(p?' past':'')+'" id="dnv"><div class="dn"><button onclick="vdGo(-1)" aria-label="'+T('Día anterior','Previous day')+'">'+ic('left')+'</button><label class="dl"><b>'+(p?fmtD(d):T('Hoy','Today'))+'</b>'+ic('cal')+'<input type="date" id="vdp" value="'+d+'" max="'+realDay()+'" aria-label="'+T('Elegir fecha','Pick date')+'" onchange="vdPick(this.value)"></label><button onclick="vdGo(1)"'+(p?'':' disabled')+' aria-label="'+T('Día siguiente','Next day')+'">'+ic('right')+'</button>'+(p?'<button class="go" onclick="vdSet(\'\')">'+T('Hoy','Today')+'</button>':'')+'</div>'+(p?'<p class="empty" style="margin:6px 0 0;font-size:14px">'+T('Editando un día anterior: no suma XP ni misiones.','Editing a past day: no XP or quests.')+'</p>':'')+'</section>'}
var _cm2=checkMissions;checkMissions=function(){if(isPast())return;_cm2()};
var CAL=null;
function trained(d){return(S.sets[d]||[]).length>0}
function tStreak(){var ks=Object.keys(S.sets).filter(trained).sort(),best=0,run=0,prev=null;ks.forEach(function(k){run=(prev&&dBetween(prev,k)<=2)?run+1:1;if(run>best)best=run;prev=k});
return{cur:(prev&&dBetween(prev,realDay())<=2)?run:0,best:best,tot:ks.length}}
function calGo(n){var c=CAL||calInit();var d=new Date(c.y,c.m+n,1);CAL={y:d.getFullYear(),m:d.getMonth()};render()}
function calInit(){var d=new Date();CAL={y:d.getFullYear(),m:d.getMonth()};return CAL}
function calOpen(d){VD=d<realDay()?d:'';tab='rutina';render();window.scrollTo(0,0)}
function calView(){var c=CAL||calInit(),st=tStreak(),first=new Date(c.y,c.m,1),off=(first.getDay()+6)%7,nd=new Date(c.y,c.m+1,0).getDate(),td=realDay(),n=0,SS=streakSet();
var mn=cf(first.toLocaleDateString(S.lang==='en'?'en-US':'es-ES',{month:'long',year:'numeric'}).replace(' de ',' '));
var h='<section class="win" id="calw"><h2>'+T('Calendario de entrenos','Workout calendar')+'</h2><div class="tot"><div><b>'+st.cur+'</b><span>'+T('racha actual','current streak')+'</span></div><div><b>'+st.best+'</b><span>'+T('mejor racha','best streak')+'</span></div><div><b>'+st.tot+'</b><span>'+T('días entrenados','days trained')+'</span></div></div><p class="empty" style="margin:6px 0 0">'+T('La racha permite 1 día de descanso entre entrenos.','The streak allows 1 rest day between workouts.')+'</p>'
+'<div class="dn" style="margin-top:10px"><button onclick="calGo(-1)" aria-label="'+T('Mes anterior','Previous month')+'">'+ic('left')+'</button><b>'+mn+'</b><button onclick="calGo(1)" aria-label="'+T('Mes siguiente','Next month')+'">'+ic('right')+'</button></div><div class="cal">';
(S.lang==='en'?['M','T','W','T','F','S','S']:['L','M','M','J','V','S','D']).forEach(function(x){h+='<span aria-hidden="true">'+x+'</span>'});
for(var i=0;i<off;i++)h+='<i></i>';
for(var k=1;k<=nd;k++){var d=c.y+'-'+String(c.m+1).padStart(2,'0')+'-'+String(k).padStart(2,'0'),t=trained(d),m=(S.meals[d]||[]).length>0;if(t)n++;
h+='<button class="'+(t?'t ':'')+(SS[d]?'s ':'')+(m?'m ':'')+(d===td?'n':'')+'" onclick="calOpen(\''+d+'\')" aria-label="'+fmtD(d)+(t?', '+T('entrenaste','trained'):'')+'">'+k+'</button>'}
return h+'</div><p class="empty" style="margin:8px 0 0">'+T('Azul: entrenaste. Punto: registraste comida. Toca un día para verlo o editarlo.','Blue: trained. Dot: meals logged. Tap a day to view or edit it.')+' '+T('Este mes: ','This month: ')+n+'</p><div class="row"><button class="go" onclick="shareImg()">'+ic('star')+' '+T('Compartir mi progreso','Share my progress')+'</button></div></section>'}
function rmBest(n){var b=0;strData(n).forEach(function(x){var e=x.r<=1?x.w:x.w*(1+Math.min(x.r,12)/30);if(e>b)b=e});return Math.round(b)}
function rmTable(n){var r=rmBest(n);if(!(r>0))return'';var P=[[95,2],[90,4],[85,6],[80,8],[75,10],[70,12],[65,15],[60,20],[50,30]];
return'<h2 style="margin-top:14px">'+T('1RM y pesos de trabajo','1RM and working weights')+'</h2><p class="empty" style="margin:0">'+T('1RM estimado (Epley): ','Estimated 1RM (Epley): ')+'<b>'+r+' lb</b></p><div class="rmt">'+P.map(function(x){return'<div><b>'+(Math.round(r*x[0]/100/5)*5)+' lb</b>'+x[0]+'% · ~'+x[1]+' '+T('reps','reps')+'</div>'}).join('')+'</div><p class="empty" style="margin:6px 0 0">'+T('Estimación aproximada; úsala con cuidado y con técnica segura.','Rough estimate; use it carefully with safe technique.')+'</p>'}
var SG=[];
function sgCalc(){var d=day(),seen={},ns=[],o=[];(S.plan||[]).forEach(function(p){ns.push(p.n)});Object.keys(S.sets).sort().forEach(function(dd){if(dd<d&&dBetween(dd,d)<=21)S.sets[dd].forEach(function(x){ns.push(x.n)})});
var today={};(S.sets[d]||[]).forEach(function(x){today[x.n.toLowerCase()]=1});
ns.forEach(function(n){var k=n.toLowerCase();if(seen[k]||today[k])return;seen[k]=1;var ses=[];Object.keys(S.sets).sort().forEach(function(dd){if(dd>=d)return;var b=0,r=0;S.sets[dd].forEach(function(x){if(x.n.toLowerCase()===k&&x.w>0){if(x.w>b){b=x.w;r=x.r}else if(x.w===b&&x.r>r)r=x.r}});if(b>0)ses.push({w:b,r:r})});
if(!ses.length)return;var a=ses[ses.length-1],q=ses[ses.length-2],z=ses[ses.length-3],t;
if(z&&a.w===q.w&&q.w===z.w&&a.r<=q.r&&q.r<=z.r)o.push({n:n,w:Math.round(a.w*.9/5)*5,r:10,es:'Llevas 3 sesiones sin avanzar: descarga a '+Math.round(a.w*.9/5)*5+' lb × 10 y vuelve a subir.',en:'3 sessions without progress: deload to '+Math.round(a.w*.9/5)*5+' lb × 10 and build back up.'});
else if(a.r>=10)o.push({n:n,w:a.w+5,r:8,es:'Hiciste '+a.w+' lb × '+a.r+'. Sube a '+(a.w+5)+' lb × 8.',en:'You did '+a.w+' lb × '+a.r+'. Go up to '+(a.w+5)+' lb × 8.'});
else o.push({n:n,w:a.w,r:a.r+1,es:'Hiciste '+a.w+' lb × '+a.r+'. Mantén el peso y busca '+(a.r+1)+' reps.',en:'You did '+a.w+' lb × '+a.r+'. Keep the weight and aim for '+(a.r+1)+' reps.'})});
return o.slice(0,6)}
function sgView(){SG=sgCalc();if(!SG.length)return'';
return'<section class="win" id="sgw"><h2>'+T('Sugerencias de progresión','Progression tips')+'</h2>'+SG.map(function(x,i){return'<div class="row" style="align-items:center;justify-content:space-between;gap:8px"><p style="margin:0;flex:1"><b>'+esc(x.n)+'</b><br><span class="empty">'+esc(T(x.es,x.en))+'</span></p><button onclick="sgUse('+i+')">'+T('Usar','Use')+'</button></div>'}).join('')+'</section>'}
function sgUse(i){var x=SG[i];if(!x)return;var e=document.getElementById('en');if(!e)return;e.value=x.n;document.getElementById('ew').value=x.w;document.getElementById('er').value=x.r;e.scrollIntoView({block:'center'});document.getElementById('ew').focus()}
function shareImg(){var W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d'),L=level(),rk=rankOf(L.l),st=tStreak();
var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#050b18');g.addColorStop(1,'#0a2a55');x.fillStyle=g;x.fillRect(0,0,W,H);
x.strokeStyle='#1fa2ff';x.lineWidth=6;x.strokeRect(30,30,W-60,H-60);
var tx=function(t,px,py,sz,col,al,wt){x.font=(wt||700)+' '+sz+'px system-ui,-apple-system,Segoe UI,sans-serif';x.fillStyle=col;x.textAlign=al||'center';x.fillText(t,px,py)};
tx('GYM LEVELING',W/2,150,72,'#4db3ff');
tx(T('Rango ','Rank ')+rk.k+' · '+T(rk.es,rk.en),W/2,250,52,rk.c);
tx(String(L.l),W/2,470,220,'#ffffff');tx(T('NIVEL','LEVEL'),W/2,535,44,'#9fb6d3');
x.fillStyle='#16335c';x.fillRect(140,580,W-280,36);x.fillStyle='#1fa2ff';x.fillRect(140,580,(W-280)*L.x/L.n,36);
tx(L.x+' / '+L.n+' XP',W/2,670,38,'#cfe3ff',null,500);
var cells=[[st.cur,T('racha actual','current streak')],[st.best,T('mejor racha','best streak')],[st.tot,T('días entrenados','days trained')]];
cells.forEach(function(q,i){var cx=W/2+(i-1)*320;tx(String(q[0]),cx,830,100,'#ffffff');tx(q[1],cx,885,34,'#9fb6d3',null,500)});
var ex={};Object.keys(S.sets).forEach(function(d){S.sets[d].forEach(function(s){if(s.w>0)ex[s.n.toLowerCase()]=s.n})});
var top=Object.keys(ex).map(function(k){return{n:ex[k],r:rmBest(k)}}).filter(function(o){return o.r>0}).sort(function(a,b){return b.r-a.r}).slice(0,3);
tx(T('MEJORES LEVANTAMIENTOS (1RM est.)','TOP LIFTS (est. 1RM)'),W/2,985,36,'#4db3ff');
top.forEach(function(o,i){var y=1060+i*80;tx(o.n.length>22?o.n.slice(0,21)+'…':o.n,120,y,44,'#ffffff','left',500);tx(o.r+' lb',W-120,y,48,'#1fa2ff','right')});
if(!top.length)tx(T('Registra series con peso para ver tus marcas','Log weighted sets to see your lifts'),W/2,1070,36,'#9fb6d3',null,500);
tx(realDay(),W/2,H-70,32,'#6f8bb0',null,500);
c.toBlob(function(b){if(!b){say(T('No se pudo crear la imagen.','Could not create the image.'));return}
var f;try{f=new File([b],'gym-leveling.png',{type:'image/png'})}catch(e){f=null}
if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'GYM Leveling'}).catch(function(){})}
else{var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gym-leveling.png';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);say(T('Imagen descargada.','Image downloaded.'))}},'image/png')}

var EA={dumb:'<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>',plate:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M3 21h18"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'};

function streakSet(){var o={},ks=Object.keys(S.sets).filter(trained).sort(),i=ks.length-1;if(i<0||dBetween(ks[i],realDay())>2)return o;o[ks[i]]=1;while(i>0&&dBetween(ks[i-1],ks[i])<=2){i--;o[ks[i]]=1}return o}
